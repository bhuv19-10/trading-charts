<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>✓ Task Manager</h1>
            <p class="subtitle">Stay organized with persistent local storage</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >
                    <button id="addBtn" class="add-btn">
                        <span>+</span> Add Task
                    </button>
                </div>
                <div class="input-options">
                    <select id="prioritySelect" class="priority-select">
                        <option value="low">Low Priority</option>
                        <option value="medium" selected>Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>
                    <select id="categorySelect" class="category-select">
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="shopping">Shopping</option>
                        <option value="health">Health</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </section>

            <!-- Filter Section -->
            <section class="filter-section">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <div class="stats">
                    <span class="stat-item">
                        <strong id="totalCount">0</strong> Total
                    </span>
                    <span class="stat-item">
                        <strong id="activeCount">0</strong> Active
                    </span>
                    <span class="stat-item">
                        <strong id="completedCount">0</strong> Done
                    </span>
                </div>
            </section>

            <!-- Tasks Container -->
            <section class="tasks-section">
                <div id="tasksList" class="tasks-list">
                    <!-- Tasks will be inserted here -->
                </div>
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">📝</div>
                    <p>No tasks yet. Add one to get started!</p>
                </div>
            </section>

            <!-- Action Buttons -->
            <section class="action-section">
                <button id="clearCompleted" class="action-btn danger">
                    🗑️ Clear Completed
                </button>
                <button id="clearAll" class="action-btn danger">
                    ⚠️ Clear All Tasks
                </button>
                <button id="exportBtn" class="action-btn primary">
                    📥 Export Tasks
                </button>
                <button id="importBtn" class="action-btn primary">
                    📤 Import Tasks
                </button>
            </section>

            <!-- Import File Input (Hidden) -->
            <input 
                type="file" 
                id="importFile" 
                class="hidden-input" 
                accept=".json"
            >
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>💾 All data saved locally • Last update: <span id="lastUpdate">just now</span></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
